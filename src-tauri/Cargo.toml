[package]
name = "haven"
version = "0.1.0"
description = "Haven — a calm home for your days, your money and your thoughts"
edition = "2021"

[lib]
# The library form is what Android loads; the desktop binary just calls into it.
name = "haven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
