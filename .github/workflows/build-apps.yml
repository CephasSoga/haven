# Builds Haven's installers entirely on GitHub's machines — nothing is needed on your computer.
#
#   Windows: Haven_<version>_x64-setup.exe  (self-contained: ships the WebView2 runtime it needs)
#   Android: Haven_<version>.apk            (64-bit ARM phones, signed so updates install over the old version)
#
# Run it from the repository's Actions tab ("Build apps" → "Run workflow"), or push a tag like v0.2.0.
# The finished installers are attached to a GitHub Release.

name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

# Your Supabase project, for accounts and sync (repository variables, not secrets: the anon key is public by design).
env:
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
  # Every build gets its own version, so installs and updates can tell builds apart
  # (Android's version code is worked out from it, and must keep going up).
  APP_VERSION: 0.2.${{ github.run_number }}
  VITE_APP_VERSION: 0.2.${{ github.run_number }}

jobs:
  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Stamp the version
        shell: bash
        run: node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.version=process.env.APP_VERSION;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Build the installer
        env:
          # Signs the update package, so installed copies only accept updates built here.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci

      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe src-tauri/target/release/bundle/nsis/*-setup.exe.sig out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: haven-windows
          path: out/*
          if-no-files-found: error

  android:
    name: Android app (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the long-retired "tools" package, which no longer exists.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install the Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Stamp the version
        shell: bash
        run: node -e "const f='src-tauri/tauri.conf.json',c=require('./'+f);c.version=process.env.APP_VERSION;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Generate the Android project
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          npx tauri android init --ci
          npx tauri icon public/favicon.svg
          # Meetings records from the microphone; reminders are notifications set for an exact time.
          python3 - <<'PY'
          import re
          p = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          extra = "".join(
              f'    <uses-permission android:name="android.permission.{name}" />\n'
              for name in ("RECORD_AUDIO", "MODIFY_AUDIO_SETTINGS", "POST_NOTIFICATIONS", "SCHEDULE_EXACT_ALARM", "USE_EXACT_ALARM", "RECEIVE_BOOT_COMPLETED")
              if f"android.permission.{name}" not in s
          )
          s = re.sub(r"(\s*<application)", "\n" + extra + r"\1", s, count=1)
          open(p, "w").write(s)
          PY
          grep -n "permission" src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Build the app
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Sign the app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-release-unsigned.apk" | head -1)
          echo "Unsigned APK: $APK"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            # Secrets pasted from a terminal can pick up line breaks or a trailing newline — drop them.
            KEYSTORE_PASSWORD=$(printf '%s' "${KEYSTORE_PASSWORD:-}" | tr -d '\r\n')
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n\t ' | base64 -d > haven.p12
            echo "Signing key: $(stat -c %s haven.p12) bytes, password ${#KEYSTORE_PASSWORD} characters"
          else
            # Without the repository's signing key the app still installs, but a later build
            # signed with a different key can't update it in place.
            echo "::warning::ANDROID_KEYSTORE_B64 is not set — signing with a one-off key."
            KEYSTORE_PASSWORD=haven-temporary
            keytool -genkeypair -keystore haven.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias haven \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Haven"
          fi
          # Fail with a clear message if the key can't be opened (wrong password or unreadable format).
          if ! keytool -list -keystore haven.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" > keytool.log 2>&1; then
            grep -iE "error|exception" keytool.log | head -3 || true
            echo "::error::The Android signing key couldn't be opened — check ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD."
            exit 1
          fi
          # The key must be stored under the alias the signing step uses.
          grep -q "^haven," keytool.log || { echo "::error::The signing key has no entry named 'haven'."; grep -E "^[^ ]+, " keytool.log | cut -d, -f1; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks haven.p12 --ks-type PKCS12 --ks-key-alias haven \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "out/Haven_${VERSION}.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "out/Haven_${VERSION}.apk" | head -3
          rm -f haven.p12

      - uses: actions/upload-artifact@v4
        with:
          name: haven-android
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Publish the installers
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # latest.json is what the Windows app's updater reads; version.json is for the Android app,
      # which can't install updates itself and just needs to know where the new .apk is.
      - name: Describe the release for the apps
        env:
          BASE: https://github.com/CephasSoga/haven/releases/download/v${{ env.APP_VERSION }}
        run: |
          set -euo pipefail
          EXE=$(cd dist && ls *-setup.exe | head -1)
          APK=$(cd dist && ls *.apk | head -1)
          NOTES="Haven ${APP_VERSION}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n --arg v "$APP_VERSION" --arg n "$NOTES" --arg d "$DATE" --arg sig "$(cat "dist/$EXE.sig")" --arg url "$BASE/$EXE" \
            '{version: $v, notes: $n, pub_date: $d, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > dist/latest.json
          jq -n --arg v "$APP_VERSION" --arg n "$NOTES" --arg d "$DATE" --arg exe "$BASE/$EXE" --arg apk "$BASE/$APK" \
            '{version: $v, notes: $n, date: $d, exe: $exe, apk: $apk}' > dist/version.json
          rm "dist/$EXE.sig"
          ls -la dist
          cat dist/version.json

      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Haven ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          # The installed apps look for updates in the latest release (latest.json, version.json).
          make_latest: true
          body: |
            Installers for Haven, built from ${{ github.sha }}.

            - **Windows:** download `Haven_${{ env.APP_VERSION }}_x64-setup.exe` and run it. Windows may say it "protected your PC" because the installer isn't code-signed — choose *More info → Run anyway*. Once installed, Haven updates itself.
            - **Android:** download `Haven_${{ env.APP_VERSION }}.apk` on your phone and open it. Allow installing from your browser when asked. Haven tells you when there's a newer one.

            Sign in with your Haven account and your data follows you between devices.
          files: dist/*
