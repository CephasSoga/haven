# Builds Haven's installers entirely on GitHub's machines — nothing is needed on your computer.
#
#   Windows: Haven_<version>_x64-setup.exe  (self-contained: ships the WebView2 runtime it needs)
#   Android: Haven_<version>.apk            (64-bit ARM phones, signed so updates install over the old version)
#
# Run it from the repository's Actions tab ("Build apps" → "Run workflow"), or push a tag like v0.2.0.
# The finished installers are attached to a GitHub Release.

name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

# Your Supabase project, for accounts and sync (repository variables, not secrets: the anon key is public by design).
env:
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

jobs:
  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Build the installer
        run: npx tauri build --ci

      - name: Collect the installer
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: haven-windows
          path: out/*.exe
          if-no-files-found: error

  android:
    name: Android app (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the long-retired "tools" package, which no longer exists.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install the Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Generate the Android project
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          npx tauri android init --ci
          npx tauri icon public/favicon.svg
          # Meetings records from the microphone.
          python3 - <<'PY'
          import re
          p = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          extra = "".join(
              f'    <uses-permission android:name="android.permission.{name}" />\n'
              for name in ("RECORD_AUDIO", "MODIFY_AUDIO_SETTINGS")
              if f"android.permission.{name}" not in s
          )
          s = re.sub(r"(\s*<application)", "\n" + extra + r"\1", s, count=1)
          open(p, "w").write(s)
          PY
          grep -n "permission" src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Build the app
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: npx tauri android build --apk --target aarch64 --ci

      - name: Sign the app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-release-unsigned.apk" | head -1)
          echo "Unsigned APK: $APK"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > haven.p12
          else
            # Without the repository's signing key the app still installs, but a later build
            # signed with a different key can't update it in place.
            echo "::warning::ANDROID_KEYSTORE_B64 is not set — signing with a one-off key."
            KEYSTORE_PASSWORD=haven-temporary
            keytool -genkeypair -keystore haven.p12 -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias haven \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Haven"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks haven.p12 --ks-type PKCS12 --ks-key-alias haven \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "out/Haven_${VERSION}.apk" aligned.apk
          "$BT/apksigner" verify --print-certs "out/Haven_${VERSION}.apk" | head -3
          rm -f haven.p12

      - uses: actions/upload-artifact@v4
        with:
          name: haven-android
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Publish the installers
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Haven {0}', github.ref_name) || format('Haven — build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          body: |
            Installers for Haven, built from ${{ github.sha }}.

            - **Windows:** download the `.exe` and run it. Windows may say it "protected your PC" because the installer isn't code-signed — choose *More info → Run anyway*.
            - **Android:** download the `.apk` on your phone and open it. Allow installing from your browser when asked.

            Your data stays on each device. Move it between them with Settings → Export / Import.
          files: dist/*
